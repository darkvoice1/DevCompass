spring:
  application:
    name: DevCompass
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: 11MB
      max-request-size: 11MB
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

devcompass:
  timezone: Asia/Shanghai
  storage:
    local-dir: data/attachments
    max-size-bytes: 10485760
