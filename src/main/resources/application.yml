spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/devcompass}
    username: ${DB_USERNAME:devcompass}
    password: ${DB_PASSWORD:devcompass}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
