spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/devcompass}
    username: ${DB_USERNAME:devcompass}
    password: ${DB_PASSWORD:devcompass}
    driver-class-name: org.postgresql.Driver

server:
  port: ${SERVER_PORT:8080}

devcompass:
  auth:
    jwt-secret: ${JWT_SECRET:devcompass-local-jwt-secret-change-me-2026}
    access-token-expiration: ${ACCESS_TOKEN_EXPIRATION:15m}
