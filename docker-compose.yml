name: devcompass

services:
  postgres:
    image: postgres:17-alpine
    container_name: devcompass-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: devcompass
      POSTGRES_USER: devcompass
      POSTGRES_PASSWORD: devcompass
    ports:
      - "5432:5432"
    volumes:
      - devcompass-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devcompass -d devcompass"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  devcompass-postgres-data:
